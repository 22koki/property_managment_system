<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Zuripo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #e8f2f1, #f7f3e8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .login-container {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(20, 45, 60, .12);
      padding: 36px;
      max-width: 440px;
      width: 100%;
    }
    .company-header { text-align: center; margin-bottom: 26px; }
    .company-header img { max-width: 90px; max-height: 90px; object-fit: contain; margin-bottom: 12px; }
    .company-header h3 { margin: 0; font-weight: 800; color: #173b4a; }
    .company-header p { margin: 4px 0 0; color: #6c757d; font-size: .9rem; }
    .form-control { border-radius: 12px; padding: .75rem .9rem; }
    .btn-login { width: 100%; border-radius: 12px; padding: .75rem; background: #173b4a; border: 0; }
    .btn-login:hover { background: #102d46; }
    .form-group { position: relative; }
    .toggle-password { cursor: pointer; position: absolute; right: 14px; top: 42px; color: #7b8794; }
  </style>
</head>
<body>
<div class="login-container">
  <div class="company-header">
    <img src="{{ url_for('static', filename='uploads/t.png') }}" alt="Zuripo Logo">
    <h3>Zuripo Property Specialists Ltd</h3>
    <p>Property Management System</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category if category else 'danger' }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}" id="loginForm">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
    </div>

    <div class="mb-4 form-group">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      <i class="bi bi-eye-slash toggle-password" id="togglePassword" aria-label="Show password"></i>
    </div>

    <button type="submit" class="btn btn-primary btn-login">
      <i class="bi bi-box-arrow-in-right me-1"></i> Login
    </button>
  </form>
</div>

<script>
  const togglePassword = document.getElementById("togglePassword");
  const password = document.getElementById("password");

  togglePassword.addEventListener("click", function () {
    const nextType = password.type === "password" ? "text" : "password";
    password.type = nextType;
    this.classList.toggle("bi-eye");
    this.classList.toggle("bi-eye-slash");
  });
</script>
</body>
</html>
